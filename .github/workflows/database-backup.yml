name: Encrypted database backup
on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
permissions:
  contents: read
jobs:
  backup:
    # An operator enables this only after configuring the two protected secrets.
    if: vars.ENABLE_DATABASE_BACKUPS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      PG_DUMP_VIA_DOCKER: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create encrypted backup
        run: node scripts/backup-full.mjs
      - name: Verify encryption and archive header
        shell: bash
        run: |
          export BACKUP_FILE="$(find backups -name '*.pgdump.enc' -type f -print -quit)"
          node scripts/verify-full-backup.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-database-backup-${{ github.run_id }}
          path: backups/
          retention-days: 7
          if-no-files-found: error
