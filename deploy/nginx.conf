worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  log_format privacy '$request_method $status $request_time';
  access_log /dev/stdout privacy;
  error_log /dev/stderr warn;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  client_max_body_size 16k;
  client_body_timeout 10s;
  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=writes:10m rate=2r/s;
  limit_req_status 429;
  map $request_method $write_limit_key { default $binary_remote_addr; GET ''; HEAD ''; OPTIONS ''; }
  limit_req_zone $write_limit_key zone=mutations:10m rate=2r/s;
  server {
    listen 8080;
    server_name _;
    server_tokens off;
    location /api/ {
      limit_req zone=api burst=20 nodelay;
      limit_req zone=mutations burst=5 nodelay;
      proxy_pass http://web:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 20s;
    }
    location / {
      proxy_pass http://web:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_read_timeout 60s;
    }
  }
}
